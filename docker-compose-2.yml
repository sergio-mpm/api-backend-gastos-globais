version: "3.9"

services:
  backend:
    build: ./api-backend-gastos-globais
    container_name: api-backend
    ports:
      - "5000:5000"
    environment:
      FLASK_APP: app.py
      FLASK_ENV: development
    networks:
      - gastos-net

  frontend:
    build: ./api-web-gastos-globais
    container_name: api-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    networks:
      - gastos-net

networks:
  gastos-net:
    driver: bridge
