version: "3.9"

services:
  backend:
    build: ./api-backend-gastos-globais   # pasta onde está o Dockerfile da API Flask
    container_name: api-backend
    ports:
      - "5000:5000"
    volumes:
      - ./api-backend-gastos-globais:/app
      - ./data:/app/data   # persistência do SQLite
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production

  frontend:
    build: ./api-web-gastos-globais       # pasta do frontend com index.html, style.css, script.js
    container_name: api-frontend
    ports:
      - "8080:80"
    volumes:
      - ./api-web-gastos-globais:/usr/share/nginx/html
